name: DevOps CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Flake8 and Pytest
    runs-on: self-hosted

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Inspect runner
      - name: Inspect runner
        run: |
          echo "Operating System:"
          uname -a

          echo "Current user:"
          whoami

          echo "Hostname:"
          hostname

          echo "Python version:"
          python --version

          echo "Working directory:"
          pwd

          echo "Files in repository:"
          ls -la

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 5. Flake8
      - name: Lint with Flake8
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          flake8 . \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      # 6. Pytest
      - name: Test with Pytest
        run: |
          pytest

  sonarqube:
    name: SonarQube Analysis
    needs: build
    runs-on: self-hosted

    steps:
      # 7. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 8. Run SonarScanner
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner

  trivy:
    name: Trivy Security Scan
    needs: sonarqube
    runs-on: self-hosted

    steps:
      # 9. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 10. Trivy filesystem scan
      - name: Security Scan with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
