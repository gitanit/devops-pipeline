name: DevOps CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. Flake8 + Pytest
  # ==========================================
  build:
    name: Flake8 and Pytest
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Inspect runner
        run: |
          echo "Operating System:"
          uname -a

          echo "Current user:"
          whoami

          echo "Hostname:"
          hostname

          echo "Python version:"
          python --version

          echo "Working directory:"
          pwd

          echo "Repository files:"
          ls -la

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Lint with Flake8
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          flake8 . \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      - name: Test with Pytest
        run: |
          pytest


  # ==========================================
  # 2. SonarQube
  # ==========================================
  sonarqube:
    name: SonarQube Analysis
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SonarQube configuration
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "SonarQube configuration:"
          cat sonar-project.properties

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN is not configured"
            exit 1
          fi

          sonar-scanner \
            -Dsonar.login="$SONAR_TOKEN"


  # ==========================================
  # 3. Trivy Filesystem Scan
  # ==========================================
  trivy:
    name: Trivy Security Scan
    needs: sonarqube
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Trivy
        run: |
          trivy --version

      - name: Trivy Filesystem Scan
        run: |
          trivy fs . \
            --severity HIGH,CRITICAL \
            --ignore-unfixed


  # ==========================================
  # 4. Build Container Image
  # ==========================================
  container:
    name: Build Container Image
    needs: trivy
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Podman
        run: |
          podman --version
          podman info

      - name: Build container image
        run: |
          podman build \
            -t localhost/devops-pipeline:${{ github.sha }} \
            .

      - name: Show container image
        run: |
          podman images | grep devops-pipeline

      - name: Test container
        run: |
          podman run --rm \
            localhost/devops-pipeline:${{ github.sha }}


  # ==========================================
  # 5. Trivy Container Image Scan
  # ==========================================
  container_scan:
    name: Trivy Container Image Scan
    needs: container
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Check Trivy
        run: |
          trivy --version

      - name: Scan container image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            localhost/devops-pipeline:${{ github.sha }}


  # ==========================================
  # 6. Push Image to Docker Hub
  # ==========================================
  push:
    name: Push Image to Docker Hub
    needs: container_scan
    runs-on: [self-hosted, Linux, X64]

    steps:

      # ----------------------------------------
      # Verify secrets exist without exposing them
      # ----------------------------------------
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is not configured"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_TOKEN is not configured"
            exit 1
          fi

          echo "Docker Hub username is configured"
          echo "Docker Hub token is configured"

      # ----------------------------------------
      # Login
      # ----------------------------------------
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | podman login docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      # ----------------------------------------
      # Tag image
      # ----------------------------------------
      - name: Tag image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          podman tag \
            localhost/devops-pipeline:${{ github.sha }} \
            docker.io/$DOCKERHUB_USERNAME/my-repository:${{ github.sha }}

          podman tag \
            localhost/devops-pipeline:${{ github.sha }} \
            docker.io/$DOCKERHUB_USERNAME/my-repository:latest

      # ----------------------------------------
      # Show tags
      # ----------------------------------------
      - name: Show Docker Hub image
        run: |
          podman images | grep my-repository

      # ----------------------------------------
      # Push commit SHA image
      # ----------------------------------------
      - name: Push commit image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          podman push \
            docker.io/$DOCKERHUB_USERNAME/my-repository:${{ github.sha }}

      # ----------------------------------------
      # Push latest image
      # ----------------------------------------
      - name: Push latest image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          podman push \
            docker.io/$DOCKERHUB_USERNAME/my-repository:latest

      # ----------------------------------------
      # Logout
      # ----------------------------------------
      - name: Logout from Docker Hub
        run: |
          podman logout docker.io
