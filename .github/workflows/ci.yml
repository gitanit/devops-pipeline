name: DevOps CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. Flake8 and Pytest
  # ==========================================
  build:
    name: Flake8 and Pytest
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Inspect runner
        run: |
          echo "Operating System:"
          uname -a

          echo "Current user:"
          whoami

          echo "Hostname:"
          hostname

          echo "Python version:"
          python --version

          echo "Working directory:"
          pwd

          echo "Files in repository:"
          ls -la

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Lint with Flake8
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          flake8 . \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      - name: Test with Pytest
        run: |
          pytest


  # ==========================================
  # 2. SonarQube
  # ==========================================
  sonarqube:
    name: SonarQube Analysis
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SonarQube configuration
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "SonarQube configuration:"
          cat sonar-project.properties

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.login="$SONAR_TOKEN"


  # ==========================================
  # 3. Trivy Filesystem Scan
  # ==========================================
  trivy:
    name: Trivy Security Scan
    needs: sonarqube
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Trivy
        run: |
          trivy --version

      - name: Trivy Filesystem Scan
        run: |
          trivy fs . \
            --severity HIGH,CRITICAL \
            --ignore-unfixed


  # ==========================================
  # 4. Build Container Image
  # ==========================================
  container:
    name: Build Container Image
    needs: trivy
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Podman
        run: |
          podman --version
          podman info

      - name: Build container image
        run: |
          podman build \
            -t localhost/devops-pipeline:${{ github.sha }} \
            .

      - name: List container image
        run: |
          podman images | grep devops-pipeline

      - name: Run container test
        run: |
          podman run --rm \
            localhost/devops-pipeline:${{ github.sha }}
