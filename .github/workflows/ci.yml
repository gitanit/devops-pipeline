name: DevOps CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. Lint and Test
  # ==========================================
  build:
    name: Flake8 and Pytest
    runs-on: [self-hosted, Linux, X64]

    steps:

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Inspect runner
      - name: Inspect runner
        run: |
          echo "Operating System:"
          uname -a

          echo "Current user:"
          whoami

          echo "Hostname:"
          hostname

          echo "Python version:"
          python --version

          echo "Working directory:"
          pwd

          echo "Files in repository:"
          ls -la

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # Flake8
      - name: Lint with Flake8
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          flake8 . \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      # Pytest
      - name: Test with Pytest
        run: |
          pytest


  # ==========================================
  # 2. SonarQube Analysis
  # ==========================================
  sonarqube:
    name: SonarQube Analysis
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Verify SonarQube configuration
      - name: Verify SonarQube configuration
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "SonarQube configuration:"
          cat sonar-project.properties

      # Check SonarQube token
      - name: Check SonarQube token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is available"
          else
            echo "SONAR_TOKEN is NOT available"
            exit 1
          fi

      # Run SonarScanner
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=devops-pipeline \
            -Dsonar.projectName=devops-pipeline \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://localhost:9000


  # ==========================================
  # 3. Trivy Security Scan
  # ==========================================
  trivy:
    name: Trivy Security Scan
    needs: sonarqube
    runs-on: [self-hosted, Linux, X64]

    steps:

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Verify Trivy installation
      - name: Check Trivy
        run: |
          trivy --version

      # Trivy filesystem scan
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
